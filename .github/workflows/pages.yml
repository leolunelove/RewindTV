name: Publish Rewind TV
on:
  push:
    branches: [main]
    paths: ['site/**', 'maintenance/build-library.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
env:
  REWIND_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify catalogue and playback data
        run: node --test maintenance/*.test.mjs
      - name: Build compact playback library
        run: node maintenance/build-library.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ env.REWIND_PAGES_ARTIFACT }}
      - name: Wait for deployment artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$REWIND_PAGES_ARTIFACT\" and .expired == false)] | length")
            if [ "$count" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployment artifact metadata did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.REWIND_PAGES_ARTIFACT }}
