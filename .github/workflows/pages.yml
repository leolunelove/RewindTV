name: Publish Rewind TV
on:
  push:
    branches: [main]
    paths: ['site/**', 'maintenance/build-library.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  REWIND_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-last.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact playback library
        run: node maintenance/build-library.mjs
      - name: Verify catalogue and playback data
        run: node --test maintenance/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ env.REWIND_PAGES_ARTIFACT }}
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.REWIND_PAGES_ARTIFACT }}
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 5
      - name: Retry deployment
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.REWIND_PAGES_ARTIFACT }}
      - name: Wait before final deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 10
      - name: Final deployment attempt
        id: deployment-last
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.REWIND_PAGES_ARTIFACT }}
